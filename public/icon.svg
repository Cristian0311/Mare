<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1B2E"/>
      <stop offset="100%" stop-color="#060A12"/>
    </linearGradient>
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14998E"/>
      <stop offset="100%" stop-color="#0D7A73"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0D7A73"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Circular Outer Background -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGrad)"/>
  
  <!-- Crisp Circular Inner Rings -->
  <circle cx="256" cy="256" r="248" fill="none" stroke="#1E293B" stroke-width="5" opacity="0.8"/>
  <circle cx="256" cy="256" r="242" fill="none" stroke="url(#mGrad)" stroke-width="3" opacity="0.5"/>

  <!-- Center Ambient Glow -->
  <circle cx="256" cy="210" r="130" fill="#0D7A73" opacity="0.22" filter="url(#glow)"/>

  <!-- MARÉ Symbol: 'M' Crest and Ocean Wave -->
  <g transform="translate(136, 85)">
    <!-- 'M' Emblem -->
    <path
      d="M20 180 V50 L120 130 L220 50 V180"
      fill="none"
      stroke="url(#mGrad)"
      stroke-width="26"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Ocean Wave Crest -->
    <path
      d="M0 160 C50 130 90 190 140 160 C190 130 230 165 240 165"
      fill="none"
      stroke="url(#waveGrad)"
      stroke-width="18"
      stroke-linecap="round"
    />
  </g>

  <!-- Brand Typography: MARÉ. -->
  <g transform="translate(256, 375)">
    <text
      x="-8"
      y="0"
      text-anchor="middle"
      font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
      font-weight="900"
      font-size="64"
      letter-spacing="5"
      fill="#FFFFFF"
    >MARÉ</text>
    <circle cx="108" cy="-14" r="9" fill="#F2C75B"/>
  </g>

  <!-- Subtitle Tagline -->
  <text
    x="256"
    y="422"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
    font-weight="800"
    font-size="17"
    letter-spacing="6"
    fill="#14998E"
    opacity="0.95"
  >TODO LO QUE BUSCAS</text>
</svg>
