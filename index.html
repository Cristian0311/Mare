  <head>
    <meta charset="UTF-8" />

    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Open Graph / Facebook -->

    <meta property="og:url" content="https://mare-a8w2.onrender.com/">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://mare-a8w2.onrender.com/">
    <meta property="twitter:title" content="MARÉ | Todo lo que buscas - Actualizado">
    <meta property="twitter:description" content="MARÉ - Todo lo que buscas - Actualizado. Tu tienda online de confianza en Cuba.">
    <meta property="twitter:image" content="/icon.svg">
    
    <title>MARÉ | Todo lo que buscas - Actualizado</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
      body { margin: 0; padding: 0; background-color: #0B1320; font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; }
      #root:empty {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: radial-gradient(circle at center, #101F33 0%, #0B1320 100%);
      }
      .initial-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        text-align: center;
        padding: 24px;
        animation: fadeIn 0.6s ease-out forwards;
        transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
      }
      .initial-loader.fade-out {
        opacity: 0;
        transform: scale(1.05);
        pointer-events: none;
      }
      .logo-container {
        position: relative;
        width: 88px;
        height: 88px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .logo-pulse-ring {
        position: absolute;
        inset: -12px;
        border-radius: 50%;
        border: 2px solid rgba(20, 153, 142, 0.35);
        animation: pulseRing 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .logo-box {
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #0F1B2E 0%, #060A12 100%);
        border: 1.5px solid rgba(255, 255, 255, 0.15);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.6), 0 0 25px rgba(20, 153, 142, 0.3);
      }
      .logo-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 50%;
      }
      .brand-title {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 34px;
        font-weight: 900;
        letter-spacing: 3px;
        background: linear-gradient(135deg, #22D3EE 0%, #14998E 50%, #0D7A73 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 2px;
        filter: drop-shadow(0 2px 8px rgba(20, 153, 142, 0.45));
      }
      .brand-title .dot { 
        color: #F2C75B; 
        -webkit-text-fill-color: #F2C75B;
      }
      .brand-slogan {
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 4px;
        color: #14998E;
        text-transform: uppercase;
        margin-top: -12px;
      }
      .wave-loader {
        width: 140px;
        height: 3px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 99px;
        overflow: hidden;
        position: relative;
        margin-top: 8px;
      }
      .wave-progress {
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, #14998E, #F2C75B, transparent);
        animation: waveShimmer 1.5s infinite;
      }
      .recovery-action {
        margin-top: 30px;
        display: none;
        animation: fadeIn 0.5s ease-out forwards;
      }
      .recovery-btn {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #14998E;
        padding: 12px 24px;
        border-radius: 16px;
        font-size: 10px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 2px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .recovery-btn:hover {
        background: rgba(20, 153, 142, 0.1);
        border-color: rgba(20, 153, 142, 0.3);
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes pulseRing {
        0%, 100% { transform: scale(1); opacity: 0.3; }
        50% { transform: scale(1.15); opacity: 0.6; }
      }
      @keyframes waveShimmer {
        0% { left: -100%; }
        100% { left: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    
    <!-- Cargador Inicial para mejorar el LCP y la percepción de velocidad -->
    <div class="initial-loader">
      <div class="logo-container">
        <div class="logo-pulse-ring"></div>
        <div class="logo-box">
          <img src="/icon-192.png" alt="MARÉ Logo" />
        </div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center;">
        <h1 class="brand-title">MARÉ<span class="dot">.</span></h1>
        <span class="brand-slogan">Todo lo que buscas - Actualizado</span>
        <div class="wave-loader">
          <div class="wave-progress"></div>
        </div>
      </div>
      
      <!-- Botón de recuperación oculta que aparece si falla la carga -->
      <div class="recovery-action" id="recoveryAction">
        <button onclick="forceResetApp()" class="recovery-btn">Reestablecer Aplicación</button>
      </div>
    </div>
    
    <script>
      // Fallback de emergencia por si React falla
      setTimeout(function() {
        var root = document.getElementById('root');
        if (root && root.innerHTML === "") {
          root.innerHTML = '<div style="background:#0B1320;color:white;height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;font-family:sans-serif;padding:20px;"><div><h1 style="font-size:24px;font-weight:900;margin-bottom:10px;">MARÉ</h1><p style="opacity:0.6;font-size:14px;">La aplicación está tardando en iniciar. Intenta recargar la página.</p><button onclick="window.location.reload(true)" style="background:#14998E;color:white;border:none;padding:12px 24px;border-radius:12px;margin-top:20px;font-weight:bold;cursor:pointer;">Recargar Aplicación</button></div></div>';
        }
      }, 15000);

      function forceResetApp() {
        console.log('Iniciando reestablecimiento forzado...');
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for(let registration of registrations) {
              registration.unregister();
            }
          });
        }
        localStorage.clear();
        sessionStorage.clear();
        window.location.reload(true);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>

  </body>
</html>
